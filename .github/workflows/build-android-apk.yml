name: Build Stack Test Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-evaluation

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Stack Test Pro
        run: npx cap sync android

      - name: Generate Android app icons
     run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick
        for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
          set -- $spec
          dir=$1
          size=$2
          mkdir -p android/app/src/main/res/$dir
          convert app-icon.png -resize ${size}x${size} android/app/src/main/res/$dir/ic_launcher.png
          cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
          cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_foreground.png
        done
            - name: Build APK
            run: |
        chmod +x android/gradlew
        cd android
        ./gradlew assembleDebug
            - name: Rename APK
              run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk StackTest_Pro_Customer_Evaluation.apk

            - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
        name: StackTest-Pro-Customer-Evaluation
        path: StackTest_Pro_Customer_Evaluation.apk

