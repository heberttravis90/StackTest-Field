name: Build Stack Test Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'rata-standards-patch.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'src/**'
      - 'scripts/**'
      - 'android-res/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run web:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Restore permanent release signing key
        env:
          STP_KEYSTORE_BASE64: ${{ secrets.STP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$STP_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret STP_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$STP_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/stacktestpro-release.jks"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Stack Test Pro Android settings
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/patch-android.mjs

      - name: Build signed release APK
        env:
          STP_KEYSTORE_FILE: ${{ github.workspace }}/stacktestpro-release.jks
          STP_KEYSTORE_PASSWORD: ${{ secrets.STP_KEYSTORE_PASSWORD }}
          STP_KEY_ALIAS: ${{ secrets.STP_KEY_ALIAS }}
          STP_KEY_PASSWORD: ${{ secrets.STP_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify signed APK exists
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk "release-output/Stack-Test-Pro-0.74.${{ github.run_number }}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Stack-Test-Pro-0.74.${{ github.run_number }}-APK
          path: release-output/Stack-Test-Pro-0.74.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
