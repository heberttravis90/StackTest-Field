name: Build Stack Test Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'src/**'
      - 'scripts/**'
      - 'android-res/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run web:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Stack Test Pro Android settings
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Stack-Test-Pro-v0.72-RC2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stack-Test-Pro-v0.72-RC2-APK
          path: Stack-Test-Pro-v0.72-RC2-debug.apk
          if-no-files-found: error
          retention-days: 30
